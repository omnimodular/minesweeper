[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "minesweeper"
version = "1.0.0"
description = "A terminal Minesweeper game with BDD tests"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-bdd"]
lint = ["ruff", "pylint"]

[project.scripts]
minesweeper = "minesweeper.main:main"

[tool.flit.sdist]
include = ["tests/", "features/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pylint.messages_control]
# BDD step definitions intentionally repeat setup and assertions across features.
disable = ["duplicate-code"]
